[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insert name here"
version = "0.1.0"
description = "IN SERT DES CRIT ION HERE MF"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
python-template = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E4", # Import errors
    "E7", # Statement errors
    "E9", # Syntax errors
    "F",  # Pyflakes
    "I",  # Import ordering
    "B",  # Common bug patterns
    "UP", # Modern Python syntax
]

[tool.pyright]
include = ["main.py", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
xfail_strict = true
