[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insert name here"
version = "0.1.0"
description = "IN SERT DES CRIT ION HERE MF"
requires-python = ">=3.10"

[project.scripts]
WTF = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
